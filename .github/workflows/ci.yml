name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: build + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version consistency
        run: pnpm version:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests
        run: pnpm test

  e2e:
    name: e2e (two Chrome contexts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The harness spawns packages/server/dist/index.js and loads
      # packages/extension/dist unpacked, so both must be built first.
      - name: Build
        run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm --filter @nobar-party/extension exec playwright install --with-deps chromium

      # playwright.config.ts runs headless:false because MV3 extensions need a
      # real browser window; xvfb provides the display.
      - name: Run E2E
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" pnpm test:e2e

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: packages/extension/test-results/
          retention-days: 7
